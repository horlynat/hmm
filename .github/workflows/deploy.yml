name: Deploy production

# Se déclenche à chaque merge sur main (backend/frontend n'arrivent ici que
# par PR, cf. infra/README.md) et peut être relancé manuellement (rollback
# via TAG, redeploy sans changement de code).
#
# Le frontend n'est volontairement PAS construit ni poussé sur GHCR ici :
# `next build` a besoin d'un backend joignable ET peuplé de contenu réel
# (cf. frontend-ci.yml) — il continue d'être construit sur le VPS pendant le
# déploiement, comme documenté en README §6. Seul le backend (qui n'a pas
# cette contrainte) passe par une image testée et versionnée sur GHCR.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      backend_tag:
        description: "Tag de l'image backend à déployer (rollback) — vide = build depuis ce commit"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build-backend-image:
    if: ${{ github.event.inputs.backend_tag == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Même Dockerfile pour backend ET messenger-worker (seule la commande
      # diffère, cf. docker-compose.prod.yml) — une seule image suffit aux
      # deux services.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/horlynat/hmm-backend:latest
            ghcr.io/horlynat/hmm-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-backend-image
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    env:
      # Rollback manuel : workflow_dispatch avec backend_tag=<sha> déploie
      # cette image existante sans en reconstruire une nouvelle.
      BACKEND_IMAGE_TAG: ${{ github.event.inputs.backend_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Diagnostic temporaire (aucune de ces valeurs n'est un secret) --
      # à retirer une fois DEPLOY_HOST confirmé résolu correctement.
      - name: Debug variables
        run: |
          echo "DEPLOY_HOST='${{ vars.DEPLOY_HOST }}' (longueur: ${#DEPLOY_HOST})"
          echo "DEPLOY_KNOWN_HOSTS length: ${#KNOWN_HOSTS}"
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}

      - name: Clé SSH de déploiement
        # DEPLOY_SSH_KEY est stockée encodée en base64 sur une seule ligne
        # (`base64 -w0 id_ed25519`) -- un copier-coller direct de la clé
        # multi-lignes dans le champ "secret" de GitHub corrompait des sauts
        # de ligne (erreur "error in libcrypto" au chargement côté runner,
        # constaté en prod). Le base64 élimine toute ambiguïté de collage.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Synchronise infra/ (compose, Traefik, scripts) et frontend/ (buildé
      # sur le VPS, cf. infra/scripts/deploy-remote.sh) — jamais backend/,
      # dont le code arrive désormais uniquement via l'image GHCR ci-dessus.
      # Exclusions : tout ce qui est local au serveur et jamais versionné
      # (secrets, certs, logs, .env.prod, dépendances/artefacts de build).
      - name: Rsync infra/ + frontend/ vers le VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude infra/secrets \
            --exclude infra/certs \
            --exclude infra/logs \
            --exclude infra/.env.prod \
            --exclude frontend/node_modules \
            --exclude frontend/.next \
            infra frontend \
            deploy@${{ vars.DEPLOY_HOST }}:/opt/hmm/

      - name: Déploiement (backend -> migrations -> worker -> frontend)
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            deploy@${{ vars.DEPLOY_HOST }} \
            "BACKEND_IMAGE_TAG=${BACKEND_IMAGE_TAG} bash /opt/hmm/infra/scripts/deploy-remote.sh"
