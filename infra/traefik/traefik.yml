# Config statique Traefik — point d'entrée public unique (guide hardening
# portfolio §2). Pas de dashboard exposé, pas d'API non plus : surface
# minimale.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls: {}
    # Restaure l'IP visiteur réelle : Cloudflare ajoute X-Forwarded-For en
    # plus de CF-Connecting-IP. On ne fait confiance à ces en-têtes que
    # depuis les IP Cloudflare elles-mêmes (cf. ../cloudflare-ips.txt et
    # _procedure_cloudflare.md Annexe A).
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/29
  traefik:
    address: ":8080"

ping:
  entryPoint: traefik

api:
  dashboard: false
  insecure: false

providers:
  docker:
    exposedByDefault: false
    network: edge-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        CF-Connecting-IP: keep
