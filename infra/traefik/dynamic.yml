# Config dynamique Traefik — certificat, headers de sécurité, rate-limit,
# whitelist IP du back-office. Rechargée à chaud (watch: true).

tls:
  certificates:
    # Certificat Cloudflare Origin (15 ans, gratuit) couvrant horlynat.com +
    # *.horlynat.com — généré côté Cloudflare (SSL/TLS → Origin Server),
    # copié dans ../certs/ (gitignored). Cf. _procedure_cloudflare.md phase 1.
    - certFile: /etc/traefik/certs/cloudflare-origin.pem
      keyFile: /etc/traefik/certs/cloudflare-origin.key
  options:
    default:
      minVersion: VersionTLS12
      sniStrict: true

http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        stsPreload: true
        forceSTSHeader: true
        contentTypeNosniff: true
        frameDeny: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    ratelimit-standard:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
        sourceCriterion:
          ipStrategy:
            depth: 1 # 1er hop derrière Cloudflare = IP visiteur réelle (forwardedHeaders)

    # Rate-limit serré pour dark.horlynat.com (login back-office) — en
    # complément de fail2ban côté hôte qui lit les logs Symfony
    # security_errors (cf. scripts/01-base-hardening.sh).
    ratelimit-strict:
      rateLimit:
        average: 5
        period: 1s
        burst: 10
        sourceCriterion:
          ipStrategy:
            depth: 1

    # Défense en profondeur, indépendante des règles iptables DOCKER-USER
    # (cf. scripts/docker-user-rules.sh) : n'accepte que le trafic annoncé
    # comme venant de Cloudflare, sur les 3 routers.
    cloudflare-only:
      ipAllowList:
        sourceRange:
          - 173.245.48.0/20
          - 103.21.244.0/22
          - 103.22.200.0/22
          - 103.31.4.0/22
          - 141.101.64.0/18
          - 108.162.192.0/18
          - 190.93.240.0/20
          - 188.114.96.0/20
          - 197.234.240.0/22
          - 198.41.128.0/17
          - 162.158.0.0/15
          - 104.16.0.0/13
          - 104.24.0.0/14
          - 172.64.0.0/13
          - 131.0.72.0/22
          - 2400:cb00::/32
          - 2606:4700::/32
          - 2803:f800::/32
          - 2405:b500::/32
          - 2405:8100::/32
          - 2a06:98c0::/29
          - 2c0f:f248::/29

    # ⚠️ À éditer avant le premier déploiement : remplacer par la/les IP
    # fixe(s) depuis lesquelles tu te connectes à dark.horlynat.com (bureau,
    # VPN perso...). Tant que ce n'est pas fait, laisser une IP factice ci-
    # dessous BLOQUE tout accès à dark. — c'est volontaire (fail-closed),
    # cf. README "Avant le premier déploiement".
    admin-ipwhitelist:
      ipAllowList:
        sourceRange:
          - "197.214.238.37/32"
        ipStrategy:
          # Sans ça, l'IP évaluée est celle de la connexion brute (Cloudflare),
          # jamais celle du visiteur — testé en prod, bloquait systématiquement
          # même la bonne IP. Même correctif que ratelimit-standard/-strict
          # ci-dessus : 1er hop derrière Cloudflare = IP visiteur réelle,
          # restaurée par forwardedHeaders (cf. traefik.yml).
          depth: 1
