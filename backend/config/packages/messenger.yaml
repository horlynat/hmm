# config/packages/messenger.yaml
framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    check_delayed_interval: 60000  # ✅ 60 secondes en millisecondes (60 * 1000)
                    table_name: messenger_messages   # Optionnel : nom de la table
                    queue_name: async                # Optionnel : nom de la file
                retry_strategy:
                    max_retries: 3
                    delay: 1000        # 1 seconde avant le 1er retry
                    multiplier: 2      # délai x2 à chaque retry
                    max_delay: 30000   # max 30 secondes

            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            'App\Message\LoginNotification': async
            'App\Message\SendEmail': async
            'App\Message\AiAssistantIngestMessage': async
            'App\Message\OffsiteBackupMessage': async
            'App\Message\RevalidateFrontendMessage': async
            # Absents de cette liste jusqu'ici malgré leur docblock ("jamais sur
            # le chemin critique d'une connexion") : sans entrée de routage, le
            # SendMessageMiddleware ne trouve aucun transport et Messenger les
            # exécute en synchrone, dans la même requête HTTP que le login —
            # exactement ce que leur conception voulait éviter (appel HTTP
            # externe ipapi.co/ip-api.com bloquant la réponse de connexion).
            # Constaté en prod le 20/08/2026 : aucune trace de ces deux classes
            # dans messenger_messages, alors que LoginHistory::location était
            # bien peuplé — la preuve qu'elles tournaient en synchrone.
            'App\Message\EnrichLoginLocationMessage': async
            'App\Message\CheckSessionAnomaliesMessage': async
            # Même oubli, même symptôme (SessionRevokedNotificationHandler
            # appelle aussi GeolocationService pour l'email de révocation) :
            # sans cette entrée, un clic admin "déconnecter" attendait
            # silencieusement un appel HTTP externe avant de répondre.
            'App\Message\SessionRevokedNotification': async

        failure_transport: failed