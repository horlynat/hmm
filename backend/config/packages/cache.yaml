framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Utilisé par le rate limiter "error_notification" (framework.yaml) :
            # pool isolé pour pouvoir le vider (cache:pool:clear cache.error_notifier)
            # sans réinitialiser les compteurs login/api/two_factor_setup, qui
            # partagent le pool cache.rate_limiter par défaut.
            cache.error_notifier:
                adapter: cache.adapter.filesystem
            # Liste de blocage des JWT (POST /api/logout, cf.
            # lexik_jwt_authentication.yaml) — en base (table cache_items, cf.
            # migration) : doit survivre à un redéploiement du conteneur, sinon
            # un jeton « déconnecté » redeviendrait valide jusqu'à son exp.
            cache.jwt_blocklist:
                adapter: cache.adapter.doctrine_dbal
            # Compteurs du délai progressif de connexion (App\Security\
            # LoginThrottle) — même stockage en base, pour la même raison.
            cache.login_throttle:
                adapter: cache.adapter.doctrine_dbal
