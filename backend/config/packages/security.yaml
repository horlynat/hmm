security:
    # 🔑 Provider principal : User avec email comme identifiant
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
        # Dédié au listener `oidc` ci-dessous (App\Security\OidcUserProvider) —
        # ne provisionne jamais de compte, cf. son docblock.
        oidc_user_provider:
            id: App\Security\OidcUserProvider

    # 🔒 Encodage des mots de passe
    password_hashers:
        App\Entity\User:
            algorithm: auto
            cost: 12        # coût pour bcrypt/argon2
            memory_cost: 1024 # mémoire utilisée pour argon2

    firewalls:
        # 🔒 Émission du JWT (stateless) — doit être déclaré AVANT "api" : chemin
        # plus spécifique (^/api/login_check) que ^/api, donc évalué en premier.
        # POST { email, password } ici renvoie { token } via lexik/jwt-authentication-bundle.
        api_login:
            pattern: ^/api/login_check
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Contrairement au formulaire web (limiter "login" dans SecurityAuthenticator),
            # rien ne limitait le bruteforce de credentials sur ce endpoint JWT.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

        # 🔒 Firewall API (stateless) — doit être déclaré AVANT "main" : "main" n'a
        # pas de `pattern` donc il matche tout, y compris /api/*, si on le laisse en
        # premier. Les firewalls Symfony sont évalués dans l'ordre et le premier dont
        # le pattern correspond gagne. Authentification par JWT Bearer token
        # (lexik/jwt-authentication-bundle) — l'ancien `custom_authenticator` ici
        # réutilisait à tort l'authenticator du formulaire web (session/CSRF),
        # incompatible avec un firewall stateless.
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

        # 🔒 Firewall principal (site web)
        main:
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: App\Security\SecurityAuthenticator
            # Deux authenticators sur ce firewall (le formulaire local +
            # oidc ci-dessous) obligent à choisir explicitement lequel gère
            # un accès anonyme à une page protégée — la connexion locale
            # reste le point d'entrée par défaut, le SSO n'est jamais que
            # l'option secondaire déclenchée par le bouton dédié.
            entry_point: App\Security\SecurityAuthenticator
            logout:
                path: logout
                target: login
                invalidate_session: true
            remember_me:
                secret: "%kernel.secret%"
                lifetime: 604800 # 7 jours
                path: /
                always_remember_me: false
                token_provider:
                    doctrine: true
            # Sans cette clé, le listener Scheb n'est jamais enregistré : la 2FA
            # activée par un utilisateur (profile/2fa/setup) n'était jamais
            # réellement demandée à la connexion (email+mot de passe suffisait).
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
            # SSO (OIDC) — second chemin de connexion, coexiste avec
            # custom_authenticator ci-dessus (Symfony essaie chaque
            # authenticator du firewall, celui dont supports() répond true
            # sur la requête courante gagne — l'OIDC authenticator ne
            # S'AUTHENTIFIE que sur check_path).
            #
            # ⚠️ Mais le service OidcClient est INSTANCIÉ à chaque requête sur
            # ce firewall (le container construit tous les authenticators
            # configurés, pas seulement celui qui va servir) — constaté en
            # direct : avec OIDC_WELL_KNOWN_URL vide, TOUT /login/* renvoyait
            # une 500 avant même d'atteindre un contrôleur. C'est pour ça que
            # cette variable garde une URL factice mais syntaxiquement valide
            # même sans IdP configuré (cf. .env) — sans quoi ce bloc `oidc`
            # casserait la connexion locale, pas seulement le SSO.
            oidc:
                client: default
                provider: oidc_user_provider
                check_path: /login/oidc-check
                user_identifier_property: email
            lazy: true

    # 🔒 Hiérarchie des rôles
    # Chaîne linéaire : chaque rang hérite de tous les droits du rang précédent.
    # USER < EDITOR < MODERATOR < MANAGER < ADMIN < SUPER_ADMIN
    role_hierarchy:
        ROLE_EDITOR: [ROLE_USER]
        ROLE_MODERATOR: [ROLE_EDITOR]
        ROLE_MANAGER: [ROLE_MODERATOR]
        ROLE_ADMIN: [ROLE_MANAGER]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    # 🔒 Contrôle d'accès par rôle
    access_control:
        - { path: ^/$, roles: ROLE_USER }                    # Accueil (HomeController) — choix entre /admin et /projects, même plancher que ce dernier
        - { path: ^/admin/profil, roles: ROLE_ADMIN }       # Profil back-office (AdminProfileController) — plus strict que ^/admin ci-dessous, doit donc le précéder (premier chemin qui matche = celui qui gagne)
        - { path: ^/admin, roles: ROLE_EDITOR }             # Back-office ouvert dès le rang Éditeur (le détail des actions est géré par les Voters)
        - { path: ^/projects, roles: ROLE_USER }            # Projets accessibles aux utilisateurs connectés
        - { path: ^/mes-devis, roles: ROLE_USER }           # Devis (lecture seule, propriétaire uniquement) accessibles aux utilisateurs connectés
        - { path: ^/user/profil, roles: ROLE_USER }         # Profil de l'espace membre (MemberProfileController) — self-service, jamais l'aside admin
        - { path: ^/login, roles: PUBLIC_ACCESS }           # Page de connexion admin (doit rester atteignable sans être authentifié) — le back-office reste gardé par ^/admin
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }        # Demande de réinitialisation, doit rester atteignable sans être authentifié
        - { path: ^/reinitialiser-mot-de-passe, roles: PUBLIC_ACCESS } # Formulaire de réinitialisation via lien email, idem
        - { path: ^/register, roles: ROLE_ADMIN }           # Inscription réservée aux admins (création d'un compte administrateur). L'inscription publique passe par le frontend Next.js (ApiResource *Registration)
        - { path: ^/verify/email, roles: PUBLIC_ACCESS }    # Vérification email publique
        - { path: ^/newsletter, roles: PUBLIC_ACCESS }      # Confirmation/désinscription newsletter (NewsletterConfirmationController) — lien cliqué depuis un client mail par un visiteur sans compte, jamais authentifié. Sans cette règle, le catch-all ci-dessous redirige vers /login (constaté en pratique).
        - { path: ^/api, roles: PUBLIC_ACCESS }              # Sécurité déléguée à API Platform (attribut `security` par opération, cf. *ApiResource)
        - { path: ^/2fa, role: IS_AUTHENTICATED_2FA_IN_PROGRESS } # /2fa + /2fa_check (formulaire + vérification) : le token Scheb en cours de 2FA ne porte aucun rôle métier tant que le second facteur n'est pas validé — sans cette règle, le catch-all ci-dessous bloquerait la connexion de tout compte 2FA avant même d'atteindre l'écran de code.
        - { path: ^/logout, roles: PUBLIC_ACCESS }           # Toujours atteignable (y compris session déjà partiellement invalidée), pour ne jamais piéger un utilisateur qui veut se déconnecter.
        - { path: ^/_(profiler|wdt), roles: PUBLIC_ACCESS }  # Barre de debug Symfony (dev uniquement, cf. config/routes/web_profiler.yaml — routes absentes en prod, règle inerte hors dev) : chargée en AJAX sur CHAQUE page, y compris /login avant authentification — sans cette règle le catch-all ci-dessous la bloquait (régression constatée en direct : /_wdt/... redirigeait vers /login).
        - { path: ^/, roles: ROLE_USER }                     # 🔒 Deny-by-default : filet de sécurité final. Toute route qui ne matche aucun motif ci-dessus exigeait implicitement PUBLIC_ACCESS ; désormais ROLE_USER est le plancher minimum, même pour un contrôleur qui oublierait #[IsGranted(...)].
   