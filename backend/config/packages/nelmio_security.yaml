nelmio_security:
    # prevents framing of the entire site
    clickjacking:
        paths:
            '^/.*': DENY

    # disables content type sniffing for script resources
    content_type:
        nosniff: true

    # Send a full URL in the `Referer` header when performing a same-origin request,
    # only send the origin of the document to secure destination (HTTPS->HTTPS),
    # and send no header to a less secure destination (HTTPS->HTTP).
    # If `strict-origin-when-cross-origin` is not supported, use `no-referrer` policy,
    # no referrer information is sent along with requests.
    referrer_policy:
        enabled: true
        policies:
            - 'no-referrer'
            - 'strict-origin-when-cross-origin'

    # Défense en profondeur contre le XSS : bloque le chargement de script/style/
    # image/police depuis un hôte tiers non listé (ex : un payload XSS stocké qui
    # tenterait de charger un script depuis un domaine attaquant). 'unsafe-inline'
    # reste nécessaire pour script-src/style-src tant que l'app s'appuie sur des
    # attributs onclick, des <script>/<style> inline (ex: base.html.twig, cf. les
    # bandeaux "flash de thème" et account_blocked) plutôt que des nonces — ça
    # n'empêche pas un payload inline injecté de s'exécuter, mais ça bloque toute
    # exfiltration/chargement de ressource vers un hôte externe non whitelisté, ce
    # qui est déjà un gain réel. Liste d'hôtes tiers réellement utilisés confirmée
    # par grep sur templates/ et assets/.
    #
    # ⚠️ 'unsafe-eval' est volontairement ABSENT de script-src. Alpine.js (utilisé
    # pour x-data/x-show/@click) a besoin d'évaluer ses expressions en JS : le
    # build standard (alpinejs@3.x.x) le fait via `new Function()`, qui exige
    # 'unsafe-eval' et casse silencieusement (pas d'erreur serveur, juste des
    # violations CSP en console) dès que ce header est actif sans ce mot-clé.
    # C'est pour ça que l'app embarque le build @alpinejs/csp (évaluateur sûr,
    # sans eval), désormais bundlé par Vite (assets/app.js) et non plus chargé
    # depuis un CDN. Si un jour Alpine.js est remplacé/mis à jour, NE PAS
    # revenir au build standard sans ajouter 'unsafe-eval' ici — sinon tous les
    # x-data de l'admin (menu mobile, accordéons du nav, dropdowns) se figent.
    #
    # Plus AUCUN hôte tiers pour script/style/font : Alpine (csp + collapse) et
    # la webfont Tabler Icons sont bundlés par Vite et servis en 'self' depuis
    # public/build. Ne restent que Google Fonts (feuille de style + fichiers
    # .woff2) pour les polices de marque.
    csp:
        enforce:
            default-src:
                - 'self'
            script-src:
                - 'self'
                - 'unsafe-inline'
            style-src:
                - 'self'
                - 'unsafe-inline'
                - 'https://fonts.googleapis.com'
            font-src:
                - 'self'
                - 'data:'
                - 'https://fonts.gstatic.com'
            img-src:
                - 'self'
                - 'data:'
                - 'https://ui-avatars.com'
            connect-src:
                - 'self'
            object-src:
                - 'none'
            base-uri:
                - 'self'
            frame-ancestors:
                - 'none'

when@dev:
    nelmio_security:
        csp:
            enforce:
                # Le serveur de dev Vite (`npm run dev`) sert les entrées JS (et injecte
                # le CSS via JS, cf. login.js/register.js) depuis http://127.0.0.1:5173,
                # avec un client HMR connecté en WebSocket. Sans ces autorisations, le
                # CSP ci-dessus bloque ce script -> le CSS ne s'applique plus du tout sur
                # les pages login/register en dev. Inutile en prod : les assets y sont
                # servis en 'self' depuis public/build (fichiers compilés par `vite build`).
                script-src:
                    - 'http://127.0.0.1:5173'
                style-src:
                    - 'http://127.0.0.1:5173'
                # font-src : la webfont Tabler Icons (assets/vendor/tabler, importée
                # par assets/app.js) charge son .woff2 depuis le serveur de dev en
                # dev. En prod elle est servie en 'self' depuis public/build.
                font-src:
                    - 'http://127.0.0.1:5173'
                connect-src:
                    - 'http://127.0.0.1:5173'
                    - 'ws://127.0.0.1:5173'

when@prod:
    nelmio_security:
        # Désactivé : redondant avec Traefik, qui est le seul point d'entrée
        # public (cf. infra/docker-compose.prod.yml) et gère déjà lui-même la
        # redirection HTTP -> HTTPS (entryPoint web -> websecure, permanent)
        # ET le HSTS (middleware security-headers, cf. infra/traefik/dynamic.yml,
        # stsSeconds/stsIncludeSubdomains/stsPreload équivalents à ci-dessous).
        # Actif ici en plus, ce réglage cassait le trafic interne Docker
        # légitime (127.0.0.1 non listé dans SYMFONY_TRUSTED_PROXIES, donc pas
        # reconnu "déjà https" — le build frontend, qui interroge l'API en
        # HTTP direct pendant `next build`, recevait une redirection 302 vers
        # https sur un port qui ne parle pas TLS et échouait avec
        # ERR_SSL_WRONG_VERSION_NUMBER — testé).
        forced_ssl:
            enabled: false
