# config/services.yaml
parameters:
    app.default_sender: '%env(APP_DEFAULT_SENDER)%'
    app.jwtsecret: '%env(APP_JWTSECRET)%'
    app.frontend_url: '%env(FRONTEND_URL)%'

    # ✅ CORRECTION 1 : utiliser %kernel.project_dir% ici (paramètre Symfony)
    #    et non dans .env où cette syntaxe n'est pas supportée
    app.upload_dir: '%kernel.project_dir%/public/uploads'
    app.backup_dir: '%kernel.project_dir%/var/backups'

    # Policy statique de secours pour App\Notifier\DatabaseChannelPolicy, utilisée
    # tant que les préférences ne sont pas en base (ou si la base est indisponible).
    # Garder alignée avec ce que décrivait notifier.yaml avant la bascule en base.
    app.notifier.fallback_policy:
        urgent: ['email']
        high: ['email']
        medium: ['email']
        low: ['email']

services:
    # ✅ CORRECTION 2 : _defaults TOUJOURS en premier
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ✅ CORRECTION 3 : injection du paramètre Symfony (pas de variable .env)
    App\Service\MediaUploader:
        arguments:
            $targetDirectory: '%app.upload_dir%'

    # Instance dédiée au logo (branding) : seul endroit de l'app où SVG/WEBP
    # doivent être acceptés — SystemSettingType::logoFile les autorise déjà
    # côté formulaire, mais l'instance par défaut de MediaUploader (jpeg/png/pdf
    # uniquement) rejetait silencieusement ces deux formats à l'upload réel.
    # Le service par défaut ci-dessus reste inchangé pour tous les autres
    # usages (articles, projets, justificatifs de dépense, témoignages).
    app.media_uploader.branding:
        class: App\Service\MediaUploader
        arguments:
            $targetDirectory: '%app.upload_dir%'
            $allowedMimeTypes: ['image/jpeg', 'image/png', 'image/svg+xml', 'image/webp']

    # Instance dédiée aux images insérées DANS le corps d'un article/projet
    # (cf. App\Controller\Admin\AdminRichTextController, rich_text_controller.js)
    # — pas de PDF (n'a pas de sens comme <img src>) ni de SVG (contenu
    # potentiellement scripté, acceptable pour un logo choisi par l'admin
    # lui-même en amont, pas pour un flux d'upload générique dans un texte).
    app.media_uploader.content:
        class: App\Service\MediaUploader
        arguments:
            $targetDirectory: '%app.upload_dir%'
            $allowedMimeTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/gif']

    # Instance dédiée aux médias d'un projet (image de couverture + galerie,
    # cf. AdminProjectController) : SVG autorisé, même raisonnement que pour
    # la branding — upload réservé à ROLE_ADMIN (ProjectVoter::EDIT), pas un
    # flux ouvert à un rôle moins élevé ni au public, donc le même niveau de
    # confiance. Risque résiduel assumé (identique à branding) : un SVG
    # uploadé reste exécutable si sa page est ouverte DIRECTEMENT par son URL
    # (contourne le rendu <img>, qui lui neutralise tout script embarqué) —
    # acceptable ici pour la même raison que pour le logo.
    app.media_uploader.project:
        class: App\Service\MediaUploader
        arguments:
            $targetDirectory: '%app.upload_dir%'
            $allowedMimeTypes: ['image/jpeg', 'image/png', 'image/webp', 'image/svg+xml', 'application/pdf']

    App\Service\JWTService:
        arguments:
            $secret: '%env(APP_JWTSECRET)%'

    App\Service\ProfileCompletionService: ~
    App\Service\GeolocationService: ~

    App\Service\SecretEncryptor:
        arguments:
            $appSecret: '%kernel.secret%'

    App\Service\GeminiIngestionClient:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
            $model: '%env(GEMINI_MODEL)%'

    App\Service\GeminiTranslator:
        arguments:
            $apiKey: '%env(GEMINI_API_KEY)%'
            $model: '%env(GEMINI_MODEL)%'

    App\Service\ClaudeClient:
        arguments:
            $apiKey: '%env(ANTHROPIC_API_KEY)%'
            $model: '%env(CLAUDE_MODEL)%'
            $fallbackModel: '%env(CLAUDE_MODEL_FALLBACK)%'

    App\Service\OffsiteBackupUploader:
        arguments:
            $uploadDir: '%app.upload_dir%'
            $endpoint: '%env(OFFSITE_S3_ENDPOINT)%'
            $bucket: '%env(OFFSITE_S3_BUCKET)%'
            $accessKeyId: '%env(OFFSITE_S3_ACCESS_KEY_ID)%'
            $secretAccessKey: '%env(OFFSITE_S3_SECRET_ACCESS_KEY)%'

    App\Service\FrontendRevalidator:
        arguments:
            $frontendUrl: '%app.frontend_url%'
            $secret: '%env(REVALIDATE_SECRET)%'

    App\Service\AiAssistantBudgetGuard:
        arguments:
            $monthlyBudgetUsd: '%env(float:ASSISTANT_MONTHLY_BUDGET_USD)%'
            $alertThresholdUsd: '%env(float:ASSISTANT_BUDGET_ALERT_THRESHOLD_USD)%'

    App\State\AiAssistantChatProcessor:
        arguments:
            $appSecret: '%kernel.secret%'

    App\State\AiContentSummaryProcessor:
        arguments:
            $appSecret: '%kernel.secret%'

    # ⚠️ doctrine-bundle (3.x) + symfony/doctrine-bridge n'auto-tagguent PAS les classes
    #    qui implémentent Doctrine\Common\EventSubscriber (contrairement aux anciennes
    #    versions) : seul le tag "doctrine.event_listener" est reconnu par
    #    RegisterEventListenersAndSubscribersPass. Sans ce tag explicite, la classe est
    #    instanciée mais jamais appelée par l'EventManager.
    App\EventSubscriber\AlertNotificationSubscriber:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postFlush }

    App\EventSubscriber\AiAssistantContentChangeSubscriber:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }
            - { name: doctrine.event_listener, event: postFlush }

    App\EventSubscriber\FrontendRevalidationSubscriber:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }
            - { name: doctrine.event_listener, event: postRemove }
            - { name: doctrine.event_listener, event: postFlush }

    App\EventSubscriber\TotpSecretEncryptionListener:
        tags:
            - { name: doctrine.event_listener, event: postLoad }

    App\EventSubscriber\TranslationHydrationListener:
        tags:
            - { name: doctrine.event_listener, event: postLoad }

    App\Service\DatabaseBackupService:
        arguments:
            $backupDir: '%app.backup_dir%'
            $ageRecipient: '%env(AGE_RECIPIENT)%'

    # ⚙️ Remplace le "notifier.channel_policy" statique (framework-bundle, config
    #    notifier.yaml) par une version pilotée depuis l'admin (Paramètres > Notifications).
    notifier.channel_policy:
        class: App\Notifier\DatabaseChannelPolicy
        arguments:
            $fallbackPolicy: '%app.notifier.fallback_policy%'

    # ✅ Sessions stockées en base (voir admin/security/sessions) : voir
    #    App\Session\ReconnectingPdoSessionHandler pour pourquoi ce n'est PAS
    #    un simple partage du PDO natif de Doctrine via un factory ('app.
    #    pdo_native_connection', retiré — un factory Symfony n'est appelé
    #    qu'une fois et son résultat figé rend PdoSessionHandler aveugle à
    #    toute reconnexion Doctrine survenant après coup dans la vie d'un
    #    worker FrankenPHP). config/packages/framework.yaml pointe
    #    `session.handler_id` vers cette classe (autowirée automatiquement,
    #    aucune déclaration explicite nécessaire ici).
